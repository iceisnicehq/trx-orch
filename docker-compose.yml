services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/pool.db
      TRON_MODE: ${TRON_MODE:-live}
      TRON_FULL_HOST: ${TRON_FULL_HOST:-https://api.trongrid.io}
      TRON_PRO_API_KEY: ${TRON_PRO_API_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_PINNED_MESSAGE_ID: ${TELEGRAM_PINNED_MESSAGE_ID:-}
      TELEGRAM_DASHBOARD_URL: ${TELEGRAM_DASHBOARD_URL:-}
      WALLETS_FILE: /app/config/wallets.json
    volumes:
      - db-data:/data
      - ./config:/app/config:ro
    expose: ["3000"]
  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"]
volumes:
  db-data:
